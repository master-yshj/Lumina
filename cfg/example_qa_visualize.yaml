# QA SFT 可视化示例配置
version: 1

experiment:
  name: TinyBert_QA_SFT_Visualize

task: qasft_visualize

run:
  checkpoint:
    path: ../experiments/TinyBert_QA_SFT/20260916_020619/checkpoints/best.pt
    train_config: ../experiments/TinyBert_QA_SFT/20260916_020619/config/config.yaml

data:
  dataset:
    type: tiny_cmrc2018
    root: ../dataset/QA/SFT/CMRC2018/tiny_cmrc2018
    splits:
      visualize: tiny_cmrc2018_visualize.jsonl
    params: {}

  loaders:
    visualize:
      batch_size: 4
      shuffle: false
      num_workers: 0
      pin_memory: false
      drop_last: false

visualize:
  methods:
    - type: attention_heatmap
      params:
        layer: all
        head: all
        max_samples: 2
    - type: loss_landscape
      params:
        normalization: per_parameter
        output_format: both
        grid_size: 32
        alpha_min: -1.0
        alpha_max: 1.0
        beta_min: -1.0
        beta_max: 1.0
        batch_count: 1
        losses:
          - name: qa_cross_entropy
            type: cross_entropy
            weight: 1.0
            params:
              ignore_index: -100

runtime:
  device:
    type: cuda
    index: null
    count: 1
