# GPT SFT Test 示例配置
# run.mode=test 结构固定：run.checkpoint、data、evaluation.metrics.test、runtime；
# 与 QA/MLM Test 仅有 dataset 类型和 metric 配置不同。

version: 1

experiment:
  name: TinyBert_GPT_SFT_Test

run:
  mode: test
  checkpoint:
    path: ../experiments/TinyBert_GPT_SFT/checkpoints/best.pt
    train_config: ../experiments/TinyBert_GPT_SFT/config/config.yaml

data:
  dataset:
    type: zhwiki_sft
    root: ../dataset/GPT/SFT/zhwiki_sft
    splits:
      test: zhwiki_sft_test.jsonl
    params:
      max_seq_length: 128

  loaders:
    test:
      batch_size: 8
      shuffle: false
      num_workers: 0
      pin_memory: false
      drop_last: false

evaluation:
  metrics:
    test:
      - type: tokenaccuracy
        params:
          ignore_index: -100

runtime:
  device:
    type: cuda
    index: null
    count: 1