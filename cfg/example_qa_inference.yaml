# QA SFT Inference 示例配置
# 结构与 MLM Inference 完全一致，仅保留任务运行目录中的占位路径；
# QA 当前暂无真实 Inferencer，本文件用于保持三任务配置结构统一。

version: 1

experiment:
  name: qasft_inference

# qasft_inference 当前仅作为配置占位，等待对应 Builder 注册。

task: qasft_inference

run:
  checkpoint:
    path: ../experiments/TinyBert_QA_SFT/checkpoints/best.pt
    train_config: ../experiments/TinyBert_QA_SFT/config/config.yaml

inference:
  max_seq_length: 128
  decoding:
    type: top_k_sampling
    params:
      top_k: 5

runtime:
  device:
    type: cuda
    index: null
    count: 1