# MLM 预训练 Test 示例配置
# Test 结构固定：run.checkpoint、losses、data、evaluation.metrics.test、runtime；
# Tokenizer 和 Model 从训练配置读取；Loss 可在 Test 配置中声明，保持与旧版
# Test 语义一致，具体训练组件仍通过 checkpoint.train_config 恢复。

version: 1

experiment:
  name: TinyBert_MLM_PreTrain_Test

task: mlmpretrain_test

run:
  checkpoint:
    path: ../experiments/TinyBert_MLM_PreTrain/20260915_235112/checkpoints/best.pt
    train_config: ../experiments/TinyBert_MLM_PreTrain/20260915_235112/config/config.yaml

losses:
    - name: mlm_cross_entropy
      type: cross_entropy
      weight: 1.0
      params:
        ignore_index: -100

data:
  dataset:
    type: base_zhwiki
    root: ../dataset/QA/pretrain/chinese_wiki/base_zhwiki
    splits:
      test: base_zhwiki_test.jsonl
    params:
      max_seq_length: 128
      mlm_prob: 0.15

  loaders:
    test:
      batch_size: 8
      shuffle: false
      num_workers: 0
      pin_memory: false
      drop_last: false

evaluation:
  metrics:
    test:
      - type: tokenaccuracy
        params:
          ignore_index: -100

runtime:
  device:
    type: cuda
    index: null
    count: 1