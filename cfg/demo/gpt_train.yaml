version: 2

experiment:
  name: Demo_GPT_Train
  seed: 42

run:
  mode: train
  resume_from: null

task:
  type: gptpretrain

components:
  tokenizer:
    type: ???
    params: ???
  model:
    type: ???
    params:
      model_path: ../../models/Transformer
    init_from: null
  losses:
    - name: gpt_loss
      type: ???
      weight: 1.0
      params: ???

data:
  dataset:
    type: demo_gpt
    root: ../../dataset/demo/gpt
    splits:
      train: train.jsonl
      valid: valid.jsonl
      test: test.jsonl
    params: ???
  loaders:
    train:
      batch_size: 2
      shuffle: true
      num_workers: 0
      pin_memory: false
      drop_last: false
    valid:
      batch_size: 2
      shuffle: false
      num_workers: 0
      pin_memory: false
      drop_last: false
    test:
      batch_size: 2
      shuffle: false
      num_workers: 0
      pin_memory: false
      drop_last: false
  collator:
    type: ???
    params: ???

optimization:
  optimizer:
    type: adamw
    params:
      lr: 0.001
      weight_decay: 0.01
      betas:
        - 0.9
        - 0.999
      eps: 1.0e-08
  scheduler:
    type: warmup
    interval: step
    params:
      warmup_steps: 1
      base_scheduler_type: steplr
      base_scheduler_params:
        step_size: 2
        gamma: 0.5
  loop:
    total_steps: 100
    accumulation_steps: 2
    log_every_steps: 10
  validation:
    enabled: true
    every_steps: 20
    early_stopping:
      enabled: true
      patience: 3
    checkpoint:
      save_every_rounds: 1

evaluation:
  test_after_train: true
  metrics:
    train:
      - type: ???
        params: ???
    valid:
      - type: ???
        params: ???
    test:
      - type: ???
        params: ???

runtime:
  device:
    type: cpu
    index: null
  precision: fp32
  distributed:
    strategy: none
    backend: null
