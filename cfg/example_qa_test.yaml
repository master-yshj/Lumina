# QA SFT Test 示例配置
# run.mode=test：Parser 要求 run.checkpoint、data、evaluation.metrics.test、runtime；
# Model/Tokenizer/Loss 结构从训练配置读取，不在本文件重复填写。

version: 1

experiment:
  name: TinyBert_QA_SFT_Test

task: qasft_test

run:
  checkpoint:
    path: ../experiments/TinyBert_QA_SFT/20260916_020619/checkpoints/best.pt
    train_config: ../experiments/TinyBert_QA_SFT/20260916_020619/config/config.yaml

losses:
    - name: mlm_cross_entropy
      type: cross_entropy
      weight: 1.0
      params:
        ignore_index: -100

data:
  dataset:
    type: cmrc2018
    root: ../dataset/QA/SFT/CMRC2018/tiny_cmrc2018
    splits:
      test: tiny_cmrc2018_test.jsonl
    params: {}

  loaders:
    test:
      batch_size: 8
      shuffle: false
      num_workers: 0
      pin_memory: false
      drop_last: false

evaluation:
  metrics:
    test:
      - type: exact_match
        params: {}
      - type: character_f1
        params: {}

runtime:
  device:
    type: cuda
    index: null
    count: 1