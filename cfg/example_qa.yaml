version: 1

experiment:
  name: TinyBert_QA_SFT
  seed: 42

run:
  resume_from: null

task: qasft_train

tokenizer:
    type: qatokenizer
    params:
      vocab_file_path: ../tokenizer/bert_base_chinese_tokenizer/vocab.txt
      do_lower_case: true
      strip_accents: false
      max_input_chars_per_word: 100

model:
    type: tinybertforquestionanswering
    params:
      model_path: ../models/Transformer
      hidden_size: 128
      max_position_embeddings: 768
      type_vocab_size: 2
      num_heads: 4
      intermediate_size: 512
      num_layers: 2
      embedding_dropout: 0.1
      attention_dropout: 0.1
      hidden_dropout: 0.1
      layer_norm_eps: 1.0e-12
    init_from:
      kind: backbone
      path: ../experiments/TinyBert_MLM_PreTrain/20260910_025839/checkpoints/best.pt

losses:
    - name: qa_cross_entropy
      type: cross_entropy
      weight: 1.0
      params:
        ignore_index: -100

# PARSE_REFACTOR_DEMO: Dataset 和 loaders 与 MLM 配置保持一致，统一放在 data 下。
data:
    dataset:
      type: cmrc2018
      root: ../dataset/QA/SFT/CMRC2018/full_cmrc2018
      splits:
        train: full_cmrc2018_train.jsonl
        valid: full_cmrc2018_valid.jsonl
        test: full_cmrc2018_test.jsonl
      params: {}

    loaders:
      train:
        batch_size: 8
        shuffle: true
        num_workers: 0
        pin_memory: false
        drop_last: false
      valid:
        batch_size: 8
        shuffle: false
        num_workers: 0
        pin_memory: false
        drop_last: false
      test:
        batch_size: 8
        shuffle: false
        num_workers: 0
        pin_memory: false
        drop_last: false

optimization:
  optimizer:
    type: adamw
    params:
      lr: 1.0e-4
      weight_decay: 0.01
      betas: [0.9, 0.999]
      eps: 1.0e-8

  scheduler:
    type: warmup
    interval: step
    params:
      warmup_steps: 1000
      base_scheduler_type: steplr
      base_scheduler_params:
        step_size: 10000
        gamma: 0.5

  loop:
    total_steps: 50000
    accumulation_steps: 1
    log_every_steps: 100

  validation:
    enabled: true
    every_steps: 500
    early_stopping:
      enabled: true
      patience: 10
    checkpoint:
      save_every_rounds: 1

evaluation:
  test_after_train: true
  metrics:
    train:
      - type: exact_match
        params: {}
      - type: character_f1
        params: {}
    valid:
      - type: exact_match
        params: {}
      - type: character_f1
        params: {}
    test:
      - type: exact_match
        params: {}
      - type: character_f1
        params: {}

runtime:
  device:
    type: cuda
    index: null
    count: 1