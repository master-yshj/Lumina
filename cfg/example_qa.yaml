version: 1

experiment:
  name: TinyBert_QA_SFT
  seed: 42

run:
  mode: train
  resume_from: null

task:
  type: qa_sft
  params: null

components:
  tokenizer:
    type: qa_wordpiece
    params: null

  model:
    type: tinybert_qa
    params: null
    init_from:
      kind: backbone
      path: ../experiments/mlm/checkpoints/best.pt

  losses:
    - name: qa_cross_entropy
      type: cross_entropy
      weight: 1.0
      params: null

data:
  dataset:
    type: cmrc2018
    root: ../dataset/QA/SFT/CMRC2018/tiny_cmrc2018
    splits:
      train: tiny_cmrc2018_train.jsonl
      valid: tiny_cmrc2018_val.jsonl
      test: tiny_cmrc2018_test.jsonl
    params: null

  collator:
    type: qa_span
    params: null

  loaders:
    train:
      batch_size: 8
      shuffle: true
      num_workers: 0
      pin_memory: false
      drop_last: false
    valid:
      batch_size: 8
      shuffle: false
      num_workers: 0
      pin_memory: false
      drop_last: false
    test:
      batch_size: 8
      shuffle: false
      num_workers: 0
      pin_memory: false
      drop_last: false

optimization:
  optimizer:
    type: adamw
    params: null

  scheduler:
    type: step_lr
    interval: step
    params: null

  loop:
    total_steps: 50000
    accumulation_steps: 1
    log_every_steps: 100

  validation:
    enabled: true
    every_steps: 500
    early_stopping:
      enabled: true
      patience: 10
    checkpoint:
      save_every_rounds: 1

evaluation:
  test_after_train: true
  metrics:
    train:
      - type: exact_match
        params: null
      - type: character_f1
        params: null
    valid:
      - type: exact_match
        params: null
      - type: character_f1
        params: null
    test:
      - type: exact_match
        params: null
      - type: character_f1
        params: null

runtime:
  device:
    type: cuda
    index: null
    count: 1