# PARSE_REFACTOR_DEMO: Smoke Test 专用 MLM Inference 配置。
# Inference 只声明推理参数、解码策略和运行环境。
version: 1
experiment:
  name: parse_smoke_mlm_inference
task: mlmpretrain_inference
run:
  checkpoint:
    # PARSE_REFACTOR_DEMO: 路径相对于 main/cfg/smoke_test/ 解析。
    path: ../../checkpoints/best.pt
    train_config: cfg/smoke_test/mlm_train.yaml
inference:
  max_seq_length: 128
  decoding:
    type: top_k_sampling
    params:
      top_k: 5
runtime:
  device:
    type: cpu
    index: null
    count: 1
