# PARSE_REFACTOR_DEMO: Smoke Test 专用 QA Train 配置。
# QA Collator 不出现在 YAML，由 QA Builder 固定创建。
version: 1
experiment:
  name: parse_smoke_qa_train
  seed: 42
run:
  resume_from: null
task: qasft_train
tokenizer:
  type: qa_tokenizer
  params:
    vocab_file_path: tokenizer/bert_base_chinese_tokenizer/vocab.txt
model:
  type: tiny_bert_for_question_answering
  params: {}
  init_from: null
losses:
  - name: qa_cross_entropy
    type: cross_entropy
    weight: 1.0
    params: {}
data:
  dataset:
    type: tiny_cmrc2018
    # PARSE_REFACTOR_DEMO: 路径相对于 main/cfg/smoke_test/ 解析。
    root: ../../dataset/QA/SFT/CMRC2018/tiny_cmrc2018
    splits:
      train: tiny_cmrc2018_train.jsonl
      valid: tiny_cmrc2018_val.jsonl
      test: tiny_cmrc2018_test.jsonl
    params: {}
  loaders:
    train:
      batch_size: 8
      shuffle: true
      num_workers: 0
      pin_memory: false
      drop_last: false
    valid:
      batch_size: 8
      shuffle: false
      num_workers: 0
      pin_memory: false
      drop_last: false
    test:
      batch_size: 8
      shuffle: false
      num_workers: 0
      pin_memory: false
      drop_last: false
optimization:
  optimizer:
    type: adam_w
    params: {}
  scheduler:
    type: step_lr
    interval: step
    params: {}
  loop:
    total_steps: 100
  validation:
    enabled: true
evaluation:
  test_after_train: false
  metrics:
    train:
      - type: exact_match
        params: {}
    valid:
      - type: exact_match
        params: {}
    test:
      - type: exact_match
        params: {}
runtime:
  device:
    type: cpu
    index: null
    count: 1
