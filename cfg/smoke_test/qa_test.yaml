# PARSE_REFACTOR_DEMO: Smoke Test 专用 QA Test 配置。
# Test 不重复声明 Tokenizer、Model 和 Loss。
version: 1
experiment:
  name: parse_smoke_qa_test
task: qasft_test
run:
  checkpoint:
    # PARSE_REFACTOR_DEMO: 路径相对于 main/cfg/smoke_test/ 解析。
    path: ../../checkpoints/best.pt
    train_config: cfg/smoke_test/qa_train.yaml
data:
  dataset:
    type: tiny_cmrc2018
    # PARSE_REFACTOR_DEMO: 路径相对于 main/cfg/smoke_test/ 解析。
    root: ../../dataset/QA/SFT/CMRC2018/tiny_cmrc2018
    splits:
      test: tiny_cmrc2018_test.jsonl
    params: {}
  loaders:
    test:
      batch_size: 8
      shuffle: false
      num_workers: 0
      pin_memory: false
      drop_last: false
evaluation:
  metrics:
    test:
      - type: exact_match
        params: {}
runtime:
  device:
    type: cpu
    index: null
    count: 1
